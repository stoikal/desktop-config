# hyprlock configuration
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# Palette mirrors config/waybar/style.css and config/hypr/hyprland.lua

$font   = Cascadia Code NF
$bg     = rgba(170e23ff)
$fg     = rgba(f8f8f2ff)
$cyan   = rgba(33ccffee)
$green  = rgba(00ff99ee)
$pink   = rgba(ff0062ee)
$orange = rgba(ff6633ee)

general {
    hide_cursor        = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    color = $bg
}

# LOCK ICON
label {
    monitor =
    text = 
    font_size = 28
    font_family = $font
    color = $cyan

    position = 0, -150
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $font
    color = $fg

    position = 0, -60
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    font_family = $font
    color = $cyan

    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.35
    dots_spacing = 0.3
    fade_on_empty = true
    rounding = 12

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(170e2366)
    check_color = rgba(00ff99ee) rgba(33ccffee) 120deg
    fail_color  = rgba(ff0062ee) rgba(ff6633ee) 40deg

    font_color = $fg
    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL

    position = 0, 100
    halign = center
    valign = center
}
